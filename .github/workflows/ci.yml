name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/*.png
            qa/*failure.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: canvesidian-plugin
          path: |
            manifest.json
            main.js
            styles.css
